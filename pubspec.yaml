name: quickdeliveries
description: "A Flutter and Firebase-based smart food ordering and delivery optimization application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  carousel_slider: ^5.1.2
  google_fonts: ^8.2.0
  cupertino_icons: ^1.0.8

  # ==========================
  # Firebase
  # ==========================
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.4.1

  # ==========================
  # State Management
  # ==========================
  provider: ^6.1.5

  # ==========================
  # Navigation
  # ==========================
  go_router: ^17.3.0

  # ==========================
  # Google Maps & Location
  # ==========================
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  # ==========================
  # Networking
  # ==========================
  http: ^1.5.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1

  # ==========================
  # Images
  # ==========================
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0

  # ==========================
  # Utilities
  # ==========================
  intl: ^0.20.2
  uuid: ^4.5.1

  # ==========================
  # UI
  # ==========================
  flutter_svg: ^2.2.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Uncomment after adding your fonts
  #
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700